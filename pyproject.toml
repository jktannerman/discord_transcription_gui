[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-transcription-gui"
version = "1.0.0"
description = "Tkinter GUI for transcribing a Discord export's images via OCR"
requires-python = ">=3.12"
dependencies = [
    "pytesseract==0.3.13",
    "pyperclip==1.10.0",
    "beautifulsoup4==4.13.5",
    "lxml==6.0.2",
    "Pillow==11.3.0",
    "pyspellchecker==0.9.0",
    "pywin32==311; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Tools for working on the app, not running it:
#   python -m pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
discord-transcription-gui = "app.main:main"

[tool.setuptools]
packages = ["app", "app.gui"]

[tool.pytest.ini_options]
markers = [
    "gui: opens a real (non-withdrawn) Tk window to test real layout/geometry - briefly visible on screen, so excluded by default; run with `-m gui` (or `-m \"\"` for the whole suite including these).",
]
addopts = "-m \"not gui\""

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Ruff's default rule set (pyflakes plus the pycodestyle errors that matter),
# plus warnings; style-only rules can be added once the code is clean.
select = ["E4", "E7", "E9", "F", "W"]
